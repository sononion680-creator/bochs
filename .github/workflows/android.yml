name: Build lBochs APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Setup Legacy Gradle 6.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '6.9'

    - name: Install Legacy Android NDK
      run: |
        sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"

    - name: Set NDK Environment Variable
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529" >> $GITHUB_ENV

    # Fix: Step into the android directory path where the actual gradle configuration lives
    - name: Compile APK via Legacy Gradle
      run: |
        cd android
        gradle assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: lBochs-Clean-Build
        path: "**/build/outputs/apk/**/*.apk"
        
