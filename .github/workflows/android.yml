name: Build lBochs APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 1: Use Java 17 temporarily so the NDK installer works perfectly
    - name: Set up Java 17 for Installer Tools
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Legacy Android NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;21.4.7075529'

    # Step 2: Now switch the environment to Java 8 which lBochs needs to compile
    - name: Switch to Java 8 for Compilation
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Set NDK Environment Variable
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Grant Execute Permissions
      run: chmod +x gradlew

    - name: Compile APK
      run: ./gradlew assembleDebug --stacktrace
      
