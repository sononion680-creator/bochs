name: Build lBochs APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Install Legacy Android NDK
      run: |
        sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"

    - name: Run Native NDK Build
      run: |
        export ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529
        export PATH=$ANDROID_NDK_HOME:$PATH
        
        # Step into the exact legacy build directory specified by the source tree
        if [ -d "build/android" ]; then
          cd build/android
          chmod +x build-core.sh || true
          ./build-core.sh || ndk-build
        else
          # Fallback if executing from root paths
          if [ -f "./build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            ndk-build
          fi
        fi

    - name: Upload Finished Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lBochs-Pure-Native-Build
        # Fix: Broaden search rules across the entire tree to grab everything generated
        path: |
          **/*.apk
          **/*.so
          build/android/**/*.apk
          
