name: Build lBochs APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 17 for Installer Tools
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Legacy Android NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;21.4.7075529'

    - name: Switch to Java 8 for Compilation
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Set NDK Environment Variable
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

    # Changed step: Using the global system gradle rather than looking for a missing local wrapper
    - name: Compile APK via Global Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: lBochs-Clean-Build
        path: "**/build/outputs/apk/**/*.apk"
        
