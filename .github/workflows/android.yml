name: Build lBochs APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Sticking to an older runner keeps older build tool compatibilities intact

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Install Legacy Android NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;21.4.7075529'

    - name: Set NDK Environment Variable
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Grant Execute Permissions
      run: chmod +x gradlew

    - name: Compile APK
      run: ./gradlew assembleDebug --stacktrace
      
