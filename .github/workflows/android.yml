name: Build lBochs APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Install Legacy Android NDK
      run: |
        sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"

    # Restored exactly back to your script's execution layout
    - name: Run Native NDK Build
      run: |
        export ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529
        export PATH=$ANDROID_NDK_HOME:$PATH
        
        if [ -f "./build.sh" ]; then
          chmod +x build.sh
          ./build.sh
        elif [ -d "jni" ]; then
          ndk-build
        else
          cd proguard || true
          ndk-build || echo "Searching for JNI paths..."
        fi

    - name: Upload Finished Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lBochs-Native-Output
        # Fix: Using a direct search pattern so it picks up the compiled binaries wherever they are dropped
        path: |
          **/*.apk
          **/*.so
          
